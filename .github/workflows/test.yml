name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run tests
        run: |
          set -e
          for test in \
            tests/test_days.py \
            tests/test_holidays.py \
            tests/test_rosters.py \
            tests/test_today.py \
            tests/test_daka_inbox.py \
            tests/test_directory.py \
            tests/test_lateness.py \
            tests/test_product.py \
            tests/test_cloud.py \
            tests/test_access_token.py \
            tests/test_security.py \
            tests/test_improvements.py \
            tests/test_part_time.py \
            tests/test_staff_write.py
          do
            echo "RUN $test"
            python "$test"
          done
          pip install pytest
          python -m pytest tests/test_app.py -q --tb=line
