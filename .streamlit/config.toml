[global]
developmentMode = false

[browser]
gatherUsageStats = false

[server]
headless = true
address = "127.0.0.1"
fileWatcherType = "poll"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#C8963E"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#3A3A3A"
font = "sans serif"
